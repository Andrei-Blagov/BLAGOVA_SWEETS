name: CI

on:
  pull_request:
  push:
    branches:
      - prototype/pattaya-atelier

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Check tracked files for accidental secrets
        run: node scripts/check-no-secrets.mjs

      - name: Install locked dependencies
        run: npm ci

      - name: Audit runtime dependencies
        run: |
          npm audit --omit=dev --omit=optional --audit-level=high
          npm audit --audit-level=critical

      - name: Run security regression tests
        run: npm run test:security

      - name: Build static storefront
        run: npm run build
