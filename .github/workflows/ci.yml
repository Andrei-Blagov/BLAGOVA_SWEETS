name: CI

on:
  pull_request:
  push:
    branches:
      - prototype/pattaya-atelier

permissions:
  contents: read

jobs:
  verify:
    name: Build and repository checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@1e60f620b9541d1a8818e1e46c5a83bafe835b57 # v4.0.3
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check tracked files for accidental secrets
        run: npm run check:secrets

      - name: Build static storefront
        run: npm run build
