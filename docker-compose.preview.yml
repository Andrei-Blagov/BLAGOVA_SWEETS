name: ${PREVIEW_COMPOSE_PROJECT:-blagova-sweets-preview}

services:
  storefront:
    image: ${PREVIEW_IMAGE:-blagova-sweets-preview:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    networks:
      proxy:
        aliases:
          - blagova-preview

networks:
  proxy:
    external: true
    name: ${PREVIEW_PROXY_NETWORK:-n8n_n8n_net}
